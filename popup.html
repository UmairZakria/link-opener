<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Opener Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-text">
        <h1>Link Opener</h1>
        <p class="subtitle">Tab Opening Preferences</p>
      </div>
    </header>

    <main class="content">
      <!-- Address Links Section -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">
            <h2>Address Links</h2>
          </div>
          <span class="badge" id="addr-count">3 active</span>
        </div>

        <div class="toggle-group">
          <label class="toggle-row" for="openAddressUnmask">
            <div class="toggle-info">
              <span class="site-name">Unmask</span>
              <span class="site-url">unmask.com</span>
            </div>
            <div class="switch">
              <input type="checkbox" id="openAddressUnmask" checked>
              <span class="slider"></span>
            </div>
          </label>

          <label class="toggle-row" for="openAddressThatsThem">
            <div class="toggle-info">
              <span class="site-name">That's Them</span>
              <span class="site-url">thatsthem.com</span>
            </div>
            <div class="switch">
              <input type="checkbox" id="openAddressThatsThem" checked>
              <span class="slider"></span>
            </div>
          </label>

          <label class="toggle-row" for="openAddressAdvanced">
            <div class="toggle-info">
              <span class="site-name">Advanced Background Checks</span>
              <span class="site-url">advancedbackgroundchecks.com</span>
            </div>
            <div class="switch">
              <input type="checkbox" id="openAddressAdvanced" checked>
              <span class="slider"></span>
            </div>
          </label>
        </div>
      </section>

      <!-- Name Links Section -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">
            <h2>Name Links</h2>
          </div>
          <span class="badge" id="name-count">2 active</span>
        </div>

        <div class="toggle-group">
          <label class="toggle-row" for="openNameThatsThem">
            <div class="toggle-info">
              <span class="site-name">That's Them</span>
              <span class="site-url">thatsthem.com</span>
            </div>
            <div class="switch">
              <input type="checkbox" id="openNameThatsThem" checked>
              <span class="slider"></span>
            </div>
          </label>

          <label class="toggle-row" for="openNameAdvanced">
            <div class="toggle-info">
              <span class="site-name">Advanced Background Checks</span>
              <span class="site-url">advancedbackgroundchecks.com</span>
            </div>
            <div class="switch">
              <input type="checkbox" id="openNameAdvanced" checked>
              <span class="slider"></span>
            </div>
          </label>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button class="btn btn-secondary" id="btn-enable-all">Enable All</button>
      <button class="btn btn-primary" id="btn-save">Save & Close</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
